on: push
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci
        working-directory: ./app
            
      - name: Run linter
        run: npm run lint
        working-directory: ./app

      - name: Run tests
        run: npm test
        
      - name: Build Docker image
        run: docker build -t devops-task3-app ./app